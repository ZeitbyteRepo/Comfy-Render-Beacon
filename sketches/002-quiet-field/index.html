ze:12px}.label{color:#a7ada2}.bar{height:7px;background:#252922;overflow:hidden}.fill{height:100%;background:#d9e96d}.memory .fill{background:#697dd7}.valueText{text-align:right;color:#dedfd8}@keyframes drift{to{transform:translate(22px,-9px) scale(1.05)}}@keyframes sweep{0%,15%{left:-90px}80%,100%{left:315px}}
