<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=480,initial-scale=1">
<title>Render Beacon — Process Rack</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap');
:root{--ink:#10120f;--surface:#1a1d18;--surface2:#252a22;--track:#30352d;--text:#efeee7;--muted:#9da399;--secondary:#b7bcb2;--done:#6d765f;--doneText:#cbd690;--lime:#dbea6f;--blue:#7082c8;--orange:#e66f47;--paper:#e8e8df}
*{box-sizing:border-box}
html,body{margin:0;width:480px;height:320px;overflow:hidden}
body{background:var(--ink);color:var(--text);font-family:"Instrument Sans",Arial,sans-serif;font-variant-numeric:tabular-nums}
.face{position:relative;width:480px;height:320px;overflow:hidden;user-select:none}
.topTiming{position:absolute;left:18px;right:18px;top:11px;height:24px;display:flex;align-items:baseline}
.topBlock{display:flex;align-items:baseline;gap:9px}.topBlock:last-child{margin-left:auto}.topLabel{font-size:10px;color:var(--muted)}.topValue{font-size:16px;font-weight:500;color:var(--text);letter-spacing:.02em}
.machine{position:absolute;left:18px;right:18px;top:45px;height:258px}
.chamber{position:absolute;left:0;top:0;width:444px;height:162px;background:var(--surface);overflow:hidden}
.stages{position:absolute;left:29px;top:9px;width:246px;display:grid;grid-template-columns:repeat(3,78px);gap:6px}
.stage{position:relative;height:128px;overflow:hidden;text-align:center;color:var(--muted);background:#1d211c;border-top:2px solid #343a32}
.stage.complete{background:#20251e;border-top-color:var(--done)}
.stage.active{background:#29251f;border-top-color:var(--orange)}
.stageIndex{position:absolute;left:8px;top:6px;font-size:10px;font-weight:500;color:var(--secondary)}
.stage.active .stageIndex{color:var(--orange)}
.stage.complete .stageIndex{color:var(--doneText)}
.stageRing{--pct:0;position:relative;width:60px;height:60px;margin:32px auto 4px;border-radius:50%;background:conic-gradient(var(--stage-color,var(--track)) calc(var(--pct)*1%),var(--track) 0);transition:background .35s linear}
.stageRing::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.stageRing::after{content:attr(data-value);position:absolute;inset:0;display:grid;place-items:center;color:var(--text);font-size:11px;font-weight:500}
.stageName{display:block;font-size:11px;color:var(--text);white-space:nowrap}
.stageDetail{display:block;margin-top:2px;font-size:10px;color:var(--secondary);white-space:nowrap}
.stage.active::after{content:"";position:absolute;left:9px;right:9px;top:23px;height:1px;background:var(--orange);opacity:.62;animation:stageScan 1.4s cubic-bezier(.45,0,.55,1) infinite alternate}
.stage.complete .stageRing::after{color:var(--doneText)}
.stage.complete .stageRing::before{background:#20251e}
.runDetail{position:absolute;left:29px;width:246px;top:145px;font-size:10px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.drive{position:absolute;left:299px;top:13px;width:116px;height:116px}
.drive svg{position:absolute;inset:0;overflow:visible}
.drive .track{stroke:var(--track)}
.drive .progress{stroke:var(--orange);stroke-dasharray:289;stroke-dashoffset:calc(289 - (289 * var(--master,0) / 100));stroke-linecap:round;transition:stroke-dashoffset .55s cubic-bezier(.16,1,.3,1)}
.mark{stroke:#474d45;stroke-width:1}
.hub{position:absolute;left:29px;top:29px;width:58px;height:58px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.hub strong{font-size:26px;font-weight:600;line-height:26px}.hub span{font-size:10px;color:var(--secondary)}
.node{position:absolute;left:289px;top:145px;width:136px;padding:0 2px;font-size:11px;color:var(--text);display:flex;justify-content:center;gap:10px}
.node span{color:var(--secondary)}
.renderMeta{position:absolute;left:0;right:0;top:174px;height:29px;padding:0 10px;background:var(--orange);color:var(--ink);display:flex;align-items:center}
.modelName{font-size:12px;font-weight:600;white-space:nowrap}.renderSpecs{margin-left:auto;font-size:11px;font-weight:500;white-space:nowrap}
.telemetry{position:absolute;left:0;right:0;top:211px;height:40px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.metric{position:relative;font-size:10px;color:#b6bbb1}
.metric b{position:absolute;left:0;top:12px;color:var(--text);font-size:11px;font-weight:500}.bar{position:absolute;left:0;right:0;top:30px;height:4px;background:var(--surface2)}.bar i{display:block;height:100%;background:var(--lime)}
.metric.cpu .bar i,.metric.temp .bar i{background:var(--orange)}.metric.vram .bar i{background:var(--blue)}.metric.ram .bar i{background:var(--paper)}
@keyframes stageScan{from{transform:translateY(0)}to{transform:translateY(68px)}}
@media(prefers-reduced-motion:reduce){.stage.active::after{animation:none}.drive .progress{transition:none}}
</style>
</head>
<body>
<main class="face" id="face" aria-label="Render Beacon process-rack concept">
  <div class="topTiming">
    <div class="topBlock"><span class="topLabel">Clock</span><strong class="topValue" id="clock">17:20</strong></div>
    <div class="topBlock"><span class="topLabel">Render time</span><strong class="topValue" id="renderTime">01:42</strong></div>
  </div>
  <section class="machine">
    <div class="chamber">
      <div class="stages" id="stages"></div>
      <div class="runDetail" id="runDetail">H3 Creator · 8 steps</div>
    </div>
    <div class="drive">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46" fill="none" stroke-width="4"/>
        <circle class="progress" cx="50" cy="50" r="46" fill="none" stroke-width="4" transform="rotate(-90 50 50)"/>
        <line class="mark" x1="50" y1="1" x2="50" y2="5"/><line class="mark" x1="99" y1="50" x2="95" y2="50"/><line class="mark" x1="50" y1="99" x2="50" y2="95"/><line class="mark" x1="1" y1="50" x2="5" y2="50"/>
      </svg>
      <div class="hub"><strong id="master">50%</strong><span>Master flow</span></div>
    </div>
    <div class="node" id="node">Generate<span>4 / 8</span></div>
    <div class="renderMeta">
      <strong class="modelName" id="modelName">MiniMax H3</strong>
      <span class="renderSpecs" id="renderSpecs">1280×720 · 6s · 24 fps</span>
    </div>
    <section class="telemetry">
      <div class="metric">GPU <b>98%</b><div class="bar"><i style="width:98%"></i></div></div>
      <div class="metric cpu">CPU <b>34%</b><div class="bar"><i style="width:34%"></i></div></div>
      <div class="metric vram">VRAM <b>20.8G</b><div class="bar"><i style="width:85%"></i></div></div>
      <div class="metric ram">RAM <b>31.4G</b><div class="bar"><i style="width:49%"></i></div></div>
      <div class="metric temp">GPU °C <b>68°</b><div class="bar"><i style="width:76%"></i></div></div>
    </section>
  </section>
</main>
<script>
const scenes=[
 {model:'MiniMax H3',specs:'1280×720 · 6s · 24 fps',detail:'H3 Creator · preparing timeline',elapsed:'00:08',master:5,active:0,node:'Prepare',step:'building',stages:[['Prepare',50,'working'],['Generate',0,'waiting'],['Finish',0,'waiting']]},
 {model:'MiniMax H3',specs:'1280×720 · 6s · 24 fps',detail:'H3 Creator · 8 steps',elapsed:'01:42',master:50,active:1,node:'Generate',step:'4 / 8',stages:[['Prepare',100,'done'],['Generate',50,'4 / 8'],['Finish',0,'waiting']]},
 {model:'MiniMax H3',specs:'1280×720 · 6s · 24 fps',detail:'H3 Creator · reel assembly',elapsed:'03:19',master:94,active:2,node:'Finish',step:'assembling',stages:[['Prepare',100,'done'],['Generate',100,'done'],['Finish',40,'working']]},
 {model:'FLUX.2 Klein',specs:'1024×1024 · model 4 / 6',detail:'Image suite · model 4 of 6',elapsed:'04:36',master:53,active:0,node:'Generate',step:'4 / 6',stages:[['Generate',67,'4 / 6'],['Assemble',0,'waiting'],['Save',0,'waiting']]},
 {model:'T2I cascade',specs:'4096×3072 · 12 images',detail:'Contact sheet · arranging outputs',elapsed:'06:02',master:88,active:1,node:'Assemble',step:'12 images',stages:[['Generate',100,'done'],['Assemble',60,'working'],['Save',0,'waiting']]},
 {model:'T2I cascade',specs:'4096×3072 · 12 images',detail:'Contact sheet · writing final',elapsed:'06:18',master:97,active:2,node:'Save',step:'writing',stages:[['Generate',100,'done'],['Assemble',100,'done'],['Save',70,'working']]}
];
let index=1;
function draw(scene){
 document.getElementById('runDetail').textContent=scene.detail;
 document.getElementById('master').textContent=`${scene.master}%`;
 document.getElementById('node').innerHTML=`${scene.node}<span>${scene.step}</span>`;
 document.getElementById('clock').textContent=new Intl.DateTimeFormat([], {hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
 document.getElementById('renderTime').textContent=scene.elapsed;
 document.getElementById('modelName').textContent=scene.model;
 document.getElementById('renderSpecs').textContent=scene.specs;
 document.querySelector('.face').style.setProperty('--master',scene.master);
 document.getElementById('stages').innerHTML=scene.stages.map((stage,i)=>{
  const classes=['stage']; if(i===scene.active)classes.push('active'); if(stage[1]===100)classes.push('complete');
  const status=stage[2].replace(/^./,c=>c.toUpperCase());
  const ringColor=stage[1]===100?'var(--done)':i===scene.active?'var(--orange)':'var(--blue)';
  return `<div class="${classes.join(' ')}"><span class="stageIndex">${i+1}</span><div class="stageRing" data-value="${stage[1]===100?'Done':stage[1]+'%'}" style="--pct:${stage[1]};--stage-color:${ringColor}"></div><span class="stageName">${stage[0]}</span><span class="stageDetail">${status}</span></div>`;
 }).join('');
}
window.renderScene=draw;
window.processScenes=scenes;
draw(scenes[index]);
window.processCycle=setInterval(()=>{index=(index+1)%scenes.length;draw(scenes[index])},1400);
</script>
</body>
</html>
