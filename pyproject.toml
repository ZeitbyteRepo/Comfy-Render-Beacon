[project]
name = "render-beacon-bridge"
version = "0.1.0"
description = "Read-only ComfyUI telemetry bridge for the Render Beacon display"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pillow==11.3.0",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["bridge"]
testpaths = ["tests"]
